<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360" role="img" aria-label="SnapGene Bridge architecture">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7C"/>
    </marker>
  </defs>
  <rect width="1240" height="360" rx="16" fill="#F5F8FB"/>
  <rect x="20" y="36" width="220" height="270" rx="12" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1.5"/>
  <path d="M 20 48 a 12 12 0 0 1 12 -12 h 196 a 12 12 0 0 1 12 12 v 34 h -220 z" fill="#6B4FBB"/>
  <text x="38" y="66" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Coding agent</text>
  <text x="38" y="124" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2D3A48">Claude Code · Codex · Cursor</text>
  <text x="38" y="172" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2D3A48">follows skills/snapgene</text>
  <text x="38" y="220" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2D3A48">one JSON object per command</text>
  <line x1="246" y1="150" x2="339" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ah)"/>
  <text x="292.5" y="140" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">sgb command</text>
  <line x1="339" y1="200" x2="246" y2="200" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ah)"/>
  <text x="292.5" y="222" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">JSON result</text>
  <rect x="345" y="36" width="360" height="270" rx="12" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1.5"/>
  <path d="M 345 48 a 12 12 0 0 1 12 -12 h 336 a 12 12 0 0 1 12 12 v 34 h -360 z" fill="#0B6FB8"/>
  <text x="363" y="66" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">snapgene-bridge</text>
  <text x="689" y="66" text-anchor="end" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8F0FA">client</text>
  <text x="363" y="116" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">design/</text>
  <text x="363" y="135" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">candidates, screening, pair ranking</text>
  <text x="363" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">oracle.py</text>
  <text x="363" y="183" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">SnapGene answer or offline estimate</text>
  <text x="363" y="212" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">transport.py</text>
  <text x="363" y="231" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">SSH, base64 script on stdin</text>
  <text x="363" y="260" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">outputs</text>
  <text x="363" y="279" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">.dna generated by SnapGene, order sheet</text>
  <line x1="711" y1="150" x2="804" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ah)"/>
  <text x="757.5" y="140" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">request</text>
  <line x1="804" y1="200" x2="711" y2="200" stroke="#5B6B7C" stroke-width="2" marker-end="url(#ah)"/>
  <text x="757.5" y="222" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">framed JSON</text>
  <rect x="810" y="36" width="410" height="270" rx="12" fill="#FFFFFF" stroke="#C9D3DE" stroke-width="1.5"/>
  <path d="M 810 48 a 12 12 0 0 1 12 -12 h 386 a 12 12 0 0 1 12 12 v 34 h -410 z" fill="#1E8A5A"/>
  <text x="828" y="66" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">SnapGene node</text>
  <text x="1204" y="66" text-anchor="end" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8F0FA">Windows + WSL</text>
  <text x="828" y="116" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">node/runner.py</text>
  <text x="828" y="135" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">lock, refuse if GUI open, diagnose timeouts</text>
  <text x="828" y="164" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">snapgene_genbank.py</text>
  <text x="828" y="183" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">GenBank-SnapGene file per job</text>
  <text x="828" y="212" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">SnapGene --convert</text>
  <text x="828" y="231" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">one process per batch computes sites and Tm</text>
  <text x="828" y="260" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0B4F8A">sgffp</text>
  <text x="828" y="279" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4A5868">read sites, Tm and alignment back</text>
  <text x="620" y="338" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4A5868">Every Tm reported as final comes from SnapGene; offline estimates are labelled estimate:nn.</text>
</svg>
