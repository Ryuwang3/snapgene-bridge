[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snapgene-bridge"
version = "0.2.0"
description = "Agent-native primer design that uses a local SnapGene install as the Tm and binding-site oracle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SnapGene Bridge contributors" }]
keywords = ["snapgene", "plasmid", "primer-design", "molecular-biology", "agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "sgffp>=0.22.1",
  "biopython>=1.84",
  "primer3-py>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
snapgene-bridge = "snapgene_bridge.cli:main"
sgb = "snapgene_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snapgene_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not node'"
markers = [
  "node: needs a configured SnapGene node (run with: pytest -m node)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
