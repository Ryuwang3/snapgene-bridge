[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "snapgene-bridge"
version = "0.1.0"
description = "Agent-native, file-first automation for SnapGene-compatible molecular biology workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SnapGene Bridge contributors" }]
keywords = ["snapgene", "plasmid", "primer-design", "molecular-biology", "agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
snapgene = ["sgffp>=0.22.1"]
bio = ["biopython>=1.84"]
design = ["primer3-py>=2.2.0"]
cloning = ["pydna>=5.5"]
full = [
  "sgffp>=0.22.1",
  "biopython>=1.84",
  "primer3-py>=2.2.0",
  "pydna>=5.5",
]

[project.urls]
Repository = "https://github.com/your-org/snapgene-bridge"
Issues = "https://github.com/your-org/snapgene-bridge/issues"

[project.scripts]
snapgene-bridge = "snapgene_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snapgene_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
